# Monitors
monitor = , preferred, auto, auto
monitor = HDMI-A-1, 1920x1080@100, 0x0, 1

# Programs & Key Definitions
$terminal = ghostty
$fileManager = thunar
$menu = rofi -show drun
$keys = ~/.config/rofi/launchers/type-1/launcher.sh
$browser = brave
$mainMod = SUPER

# Autostart
exec-once = awww-daemon
exec-once = waybar
exec-once = dunst
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = ~/.config/hypr/scripts/wallpaper.sh
exec-once = cursor-clip --daemon

# Environment Variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice

# General & Styling
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2.0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor, 1, 7, quick
}

# Layouts
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# Input & Gestures
input {
    kb_layout = us
    kb_variant = 
    kb_model = 
    kb_options = 
    kb_rules = 

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Miscellaneous
misc {
    disable_hyprland_logo = true
    vrr = 0
}

# Keybindings
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, ~/.config/rofi/launchers/type-2/launcher.sh
bind = $mainMod, P, pseudo
bind = $mainMod, B, exec, $browser
bind = $mainMod ALT, R, exec, rofi -show run
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, E, exec, rofi -show p -modi p:"rofi-power-menu"

# Window Focus & Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod ALT, F, togglefloating

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod ALT, left, workspace, e-1
bind = $mainMod ALT, right, workspace, e+1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Special Workspace (Scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, D, movetoworkspace, special:magic

# Mouse Binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Utilities & Media
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, I, exec, ~/.config/hypr/scripts/keybinds.sh
bind = $mainMod, Print, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = ALT, Print, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy
bind = $mainMod ALT, V, exec, cursor-clip
bind = $mainMod ALT, C, exec, hyprpicker -a
bind = $mainMod, X, exec, kitty -e btm
bind = $mainMod, N, exec, dunstctl close-all
bind = $mainMod, F1, exec, pavucontrol
bind = $mainMod, F2, exec, blueman-manager
bind = $mainMod, F3, exec, nm-connection-editor

# Audio & Brightness
bindel = ,F11, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,F10, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,F9, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde = ALT, up, exec, ~/.config/hypr/scripts/brightness.sh +
binde = ALT, down, exec, ~/.config/hypr/scripts/brightness.sh -
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bind = ALT, Q, exec, ~/.config/hypr/scripts/wallpaper.sh

# Gap Controls
bind = $mainMod CTRL, G, exec, hyprctl keyword general:gaps_in 0 && hyprctl keyword general:gaps_out 0
bind = $mainMod SHIFT, G, exec, hyprctl keyword general:gaps_in 5 && hyprctl keyword general:gaps_out 20

# Window Rules
windowrule = match:title ^(Open File)$, float 1
windowrule = match:title ^(Select a File)$, float 1
windowrule = match:title ^(Choose)$, float 1
windowrule = match:title ^(Save As)$, float 1
windowrule = match:class ^(pavucontrol)$, float 1
windowrule = match:class ^(blueman-manager)$, float 1
windowrule = match:class ^(nm-connection-editor)$, float 1
windowrule = match:class ^(polkit-gnome-authentication-agent-1)$, float 1
